name: E2E (live GitHub scan)

on:
  pull_request:
  schedule:
    # Nightly at 03:17 UTC (off-peak, avoids the top-of-hour API rush).
    - cron: "17 3 * * *"
  workflow_dispatch:

# Only one live-scan run per branch at a time: cancels superseded PR runs so
# we never burn GitHub API quota on stale commits.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run end-to-end scan test
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          GITHUB_API_KEY: ${{ secrets.GITHUB_API_KEY }}
        run: bun run test:e2e
