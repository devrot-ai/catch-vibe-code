name: E2E (live GitHub scan)

on:
  pull_request:
  schedule:
    # Nightly at 03:17 UTC (off-peak, avoids the top-of-hour API rush).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      retry_coverage_lines:
        description: Minimum retry line coverage percentage (0-100)
        required: false
        default: "90"
        type: string
      retry_coverage_functions:
        description: Minimum retry function coverage percentage (0-100)
        required: false
        default: "90"
        type: string

# Only one live-scan run per branch at a time: cancels superseded PR runs so
# we never burn GitHub API quota on stale commits.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run retry unit tests
        run: bun run test:unit

      # Coverage gate: the retry logic must stay exercised, so a regression
      # that removes or bypasses it fails here instead of in production.
      - name: Check retry coverage threshold
        env:
          RETRY_COVERAGE_LINES: ${{ inputs.retry_coverage_lines || vars.RETRY_COVERAGE_LINES || '90' }}
          RETRY_COVERAGE_FUNCS: ${{ inputs.retry_coverage_functions || vars.RETRY_COVERAGE_FUNCS || '90' }}
        run: bun run test:coverage

      - name: Run end-to-end scan test
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          GITHUB_API_KEY: ${{ secrets.GITHUB_API_KEY }}
          # Retry tuning knobs — raise these if CI hits GitHub throttling.
          GITHUB_RETRY_MAX_ATTEMPTS: ${{ vars.GITHUB_RETRY_MAX_ATTEMPTS || '4' }}
          GITHUB_RETRY_BASE_MS: ${{ vars.GITHUB_RETRY_BASE_MS || '500' }}
          GITHUB_RETRY_JITTER_MS: ${{ vars.GITHUB_RETRY_JITTER_MS || '250' }}
          GITHUB_RETRY_MAX_WAIT_MS: ${{ vars.GITHUB_RETRY_MAX_WAIT_MS || '10000' }}
          GITHUB_RETRY_TOTAL_WAIT_MS: ${{ vars.GITHUB_RETRY_TOTAL_WAIT_MS || '20000' }}
        run: bun run test:e2e

      - name: Validate throttling report and export CSV
        if: always() && hashFiles('test-results/e2e-skipped.txt') == ''
        run: bun run report:throttling

      # A self-skip means the live scan never ran: make that loud instead of
      # letting a misconfigured secret pass as a green run.
      - name: Warn when the live scan self-skipped
        if: always()
        run: |
          if [ -f test-results/e2e-skipped.txt ]; then
            missing=$(cat test-results/e2e-skipped.txt)
            echo "::warning title=E2E scan skipped::Live GitHub scan did not run - missing secrets: $missing"
            {
              echo "### :warning: E2E live scan skipped"
              echo ""
              echo "Missing secrets: \`$missing\`"
              echo ""
              echo "The end-to-end GitHub scan self-skipped, so this green run does not prove the analyzer works."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Throttling/retry stats on the run summary, pass or fail, so a slow or
      # retry-heavy (flaky) run is visible without downloading the artifact.
      - name: Scan throttling summary
        if: always()
        run: bun scripts/throttling-summary.mjs

      # On failure, upload the scan report (raw signals, health banner, score
      # breakdown) so the failure can be debugged without re-running the scan.
      - name: Upload scan report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scan-report-${{ github.run_id }}
          path: |
            test-results/e2e-scan-report.json
            test-results/e2e-throttling.json
            test-results/e2e-throttling.csv
          if-no-files-found: warn
          retention-days: 14
